name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      # Runtime + dev dependencies only: PyTorch lives in the "train" group, which the tests do not need.
      - run: uv sync --frozen --no-group train
      # Includes the safety guardrail tests (tests/test_guardrail.py): any failure blocks the merge.
      - run: uv run --no-sync pytest -q

  docker:
    name: Docker image builds and the server starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The unit tests cannot see a missing system library (a Render deploy once crashed on libexpat, which rasterio
      # needs). So build the same image Render builds and actually start the server inside it.
      - run: docker build -t dehqan-api backend
      - name: Start the container and check it is healthy and has every route
        run: |
          docker run -d --name api -p 10000:10000 dehqan-api
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:10000/health | grep -q '"models_loaded":true'; then break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' api)" != "true" ]; then echo "container exited"; docker logs api; exit 1; fi
            sleep 2
          done
          curl -fsS http://localhost:10000/health | grep -q '"models_loaded":true' || { docker logs api; exit 1; }
          routes=$(curl -fsS http://localhost:10000/openapi.json)
          for r in /diagnose /spray-window /market /field-ndvi /ask /status; do
            echo "$routes" | grep -q "\"$r\"" || { echo "route $r is missing"; exit 1; }
          done
          echo "container healthy, all routes present"

  frontend:
    name: Frontend lint, types, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
