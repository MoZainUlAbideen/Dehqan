[project]
name = "dehqan-backend"
version = "0.1.0"
description = "Voice-first crop doctor and market advisor for Pakistani farmers"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.1.0",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "huggingface-hub>=2.2.0",
    "pillow>=12.3.0",
    "python-multipart>=0.0.32",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "transformers>=5.19.0",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
